[package]
name = "game-launcher"
version = "1.6.0"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "dialog-all", "protocol-asset", "window-all", "system-tray", "icon-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.0"
winreg = "0.52"
reqwest = { version = "0.11", features = ["blocking"] }
dirs = "5.0"
chrono = "0.4"
tungstenite = "0.21"
scrypt = "0.11"
rand = "0.8"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
aes-gcm = "0.10"
lazy_static = "1.4"
local-ip-address = "0.5"
windows = { version = "0.37", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
] }

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
